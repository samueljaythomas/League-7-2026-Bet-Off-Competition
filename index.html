<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>League #7 Draft Order Competition</title>
<meta name="theme-color" content="#131316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="League #7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151517'/%3E%3Ctext x='50' y='68' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='58' font-weight='800' fill='%23dcb35e' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23151517'/%3E%3Ctext x='50' y='68' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='58' font-weight='800' fill='%23dcb35e' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:calc(20px + env(safe-area-inset-top)) 14px calc(42px + env(safe-area-inset-bottom));
    background:
      radial-gradient(900px 380px at 50% -190px,rgba(212,175,90,.10) 0%,transparent 70%),
      #131316;
    color:#f0eee8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:470px;margin:0 auto}

  h1{
    font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.25;
    background:linear-gradient(120deg,#f3d888 0%,#d4af5a 55%,#b8903f 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{height:2px;width:38px;margin:9px 0 12px;border-radius:2px;
    background:linear-gradient(90deg,#e6c065,#8a6a2a)}

  .bar{display:flex;align-items:center;gap:9px;margin:0 0 16px;font-size:11.5px;
    color:#8c8d93}
  .dot{width:7px;height:7px;border-radius:50%;background:#3d3d42;flex:none}
  .dot.live{background:#39d97a;box-shadow:0 0 0 0 rgba(57,217,122,.65);animation:p 2s infinite}
  @keyframes p{70%{box-shadow:0 0 0 7px rgba(57,217,122,0)}100%{box-shadow:0 0 0 0 rgba(57,217,122,0)}}
  .bar span{flex:1}
  .rf{width:29px;height:29px;border-radius:9px;background:#1c1c1f;border:1px solid #2c2c31;
    color:#9a9ba1;font-size:15px;font-family:inherit;flex:none;transition:border-color .15s}
  .rf:active{border-color:#d4af5a;color:#d4af5a}

  .tabs{display:flex;gap:4px;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:13px;
    padding:4px;margin-bottom:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
  .tab{flex:1;padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:600;
    color:#8c8d93;border:none;background:none;font-family:inherit;transition:background .15s,color .15s}
  .tab.on{background:linear-gradient(155deg,#e3c06e,#b98f3a);color:#211a0c;
    box-shadow:0 2px 8px -2px rgba(201,155,50,.5)}

  .pane{display:none}.pane.on{display:block}

  .card{background:#1a1a1d;border:1px solid #2a2a2e;border-radius:16px;overflow:hidden;
    margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 6px 18px -12px rgba(0,0,0,.5)}
  .hd{padding:14px 16px 11px;border-bottom:1px solid #26262a;position:relative}
  .hd h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.005em}
  .hd p{margin:3px 0 0;font-size:11.5px;color:#8c8d93}

  .lb{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid #232327;
    border-left:3px solid transparent}
  .lb:last-child{border-bottom:none}
  .lb.p1{border-left-color:#e0b64f;
    background:linear-gradient(90deg,rgba(224,182,79,.10),transparent 62%)}
  .lb.p2{border-left-color:#b7b9bf}
  .lb.p3{border-left-color:#c3915a}
  .rk{width:20px;font-size:15px;font-weight:800;color:#8c8d93;flex:none}
  .lb.p1 .rk{color:#e0b64f}
  .nm{flex:1;min-width:0}
  .nm b{font-size:15px;font-weight:700;display:block;color:#f0eee8}
  .nm i{font-style:normal;font-size:10.5px;color:#8c8d93;display:block;margin-top:2px}
  .amt{text-align:right;flex:none}
  .amt b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;display:block;
    color:#f0eee8}
  .amt i{font-style:normal;font-size:9.5px;color:#8c8d93}
  .live-amt{color:#39d97a}

  .bet{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid #232327}
  .bet:last-child{border-bottom:none}
  .pill{font-size:8.5px;font-weight:800;padding:3px 6px;border-radius:5px;flex:none;
    width:54px;text-align:center;letter-spacing:.03em}
  .won{background:#123825;color:#5eeb9a}
  .lost{background:#3a1620;color:#ff8fa0}
  .cover{background:#173a2b;color:#4ee39c}
  .notcover{background:#3a2a14;color:#f0ab5c}
  .pend{background:#232327;color:#9a9ba1}
  .push{background:#1d2532;color:#9cb3d4}
  .bi{flex:1;min-width:0}
  .bi b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;color:#f0eee8}
  .bi i{font-style:normal;font-size:10.5px;color:#8c8d93;display:block;margin-top:1px}
  .bw{text-align:right;flex:none;font-size:14px;font-weight:700;
    font-variant-numeric:tabular-nums;min-width:48px;color:#f0eee8}
  .bw.dim{color:#5b5c61}

  .gscore{float:right;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
    color:#f0eee8}
  .badge.live{position:absolute;top:14px;right:16px;background:#123825;color:#39d97a;
    font-size:9px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:6px}
  .hd .badge.live + h2{padding-right:46px}

  .empty{padding:34px 18px;text-align:center;font-size:13px;color:#8c8d93}

  .seg{display:flex;gap:4px;background:#1a1a1d;border:1px solid #2a2a2e;border-radius:11px;
    padding:3px;margin-bottom:12px}
  .seg button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;
    color:#8c8d93;border:none;background:none;font-family:inherit;transition:background .15s,color .15s}
  .seg button.on{background:#26262b;color:#e0b64f}

  .note{padding:12px 16px;font-size:11px;color:#8c8d93;line-height:1.5;
    border-top:1px solid #232327}

  footer{text-align:center;font-size:10.5px;color:#4a4a50;margin-top:24px;letter-spacing:.01em}
</style>
</head>
<body>
<div class="wrap">
  <h1>League #7 Draft Order Competition</h1>
  <div class="rule"></div>
  <div class="bar"><i class="dot" id="dot"></i><span id="status">Loading…</span>
    <button class="rf" id="rf">&#8635;</button></div>

  <div class="tabs">
    <button class="tab on" data-tab="board">Leaderboard</button>
    <button class="tab" data-tab="bets">All bets</button>
  </div>

  <div class="pane on" data-pane="board">
    <div class="seg"><button class="on" data-bsort="total">By total</button>
      <button data-bsort="max">By potential</button></div>
    <div id="board"></div>
  </div>
  <div class="pane" data-pane="bets">
    <div class="seg"><button class="on" data-by="person">By person</button>
      <button data-by="game">By game</button></div>
    <div id="bets"></div>
  </div>
  <footer>Scores from ESPN &middot; refreshes every 45s</footer>
</div>

<script>
(function () {
  var PEOPLE = ["Sam","Dan","Cody","Fitz","Bret","Barreto","Seth","Kirk","Doug","Kyle"];
  var ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";
  var POLL = 45000;
  var STAKE = 5;              // wager per bet
  var COUNT_STAKE = false;    // set "scoring":"returned" in bets.json to include it
  var data = null, games = {}, lastOk = null, timer = null, groupBy = "person";
  var boardSort = "total";

  /* ---------- bet evaluation ---------- */
  // Returns: pending | won | lost | push | cover | notcover  (+ margin info)
  function evaluate(bet, game) {
    if (!game) return { state: "pending", label: "NO GAME", note: "game not found" };
    var me = game.teams[bet.teamId], opp = game.teams[bet.oppId];
    if (!me || !opp) return { state: "pending", label: "?", note: "team not in game" };

    if (game.state === "pre") {
      return { state: "pending", label: "PENDING", note: game.startText };
    }
    var margin = me.score - opp.score;
    var edge = margin + Number(bet.line);
    var final = game.state === "post";

    if (Math.abs(edge) < 1e-9) {
      return final
        ? { state: "push", label: "PUSH", note: "line landed exactly" }
        : { state: "notcover", label: "ON LINE", note: "sitting on the number" };
    }
    if (edge > 0) {
      return final
        ? { state: "won", label: "WON", note: "covered by " + fmtNum(edge) }
        : { state: "cover", label: "COVERING", note: "up " + fmtNum(edge) + " on the line" };
    }
    return final
      ? { state: "lost", label: "LOST", note: "missed by " + fmtNum(-edge) }
      : { state: "notcover", label: "NEEDS " + fmtNum(-edge), note: "short by " + fmtNum(-edge) };
  }

  function fmtNum(n) { return (Math.round(n * 10) / 10).toString(); }
  function kickoff(gameId) {
    var g = games[gameId];
    return g && g.start ? g.start : Infinity;   // unknown games go last
  }
  function byKickoff(a, b) { return kickoff(a) - kickoff(b); }
  function payout(b) { return Number(b.toWin) + (COUNT_STAKE ? STAKE : 0); }
  function money(n) {
    return "$" + n.toFixed(2).replace(/\.00$/, "");
  }
  function sign(n) { return (n > 0 ? "+" : "") + n; }

  /* ---------- fetching ---------- */
  function loadBets() {
    return fetch("bets.json?t=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error("bets.json missing");
      return r.json();
    });
  }

  function loadGames(date) {
    var url = ESPN + "?dates=" + date + "&groups=80&limit=300";
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var out = {};
      (j.events || []).forEach(function (ev) {
        var comp = (ev.competitions || [])[0];
        if (!comp) return;
        var teams = {}, list = [];
        (comp.competitors || []).forEach(function (c) {
          var t = {
            id: String(c.team.id),
            abbr: c.team.abbreviation || c.team.shortDisplayName,
            name: c.team.shortDisplayName || c.team.displayName,
            score: Number(c.score || 0),
            home: c.homeAway === "home"
          };
          teams[t.id] = t;
          list.push(t);
        });
        list.forEach(function (t, i) { t.opp = list[1 - i]; });
        var st = ev.status || comp.status || {};
        out[String(ev.id)] = {
          id: String(ev.id),
          short: ev.shortName || ev.name,
          teams: teams,
          list: list,
          state: (st.type || {}).state || "pre",
          detail: (st.type || {}).shortDetail || "",
          start: new Date(ev.date).getTime() || 0,
          startText: new Date(ev.date).toLocaleTimeString([], {
            hour: "numeric", minute: "2-digit"
          })
        };
      });
      return out;
    });
  }

  /* ---------- rendering ---------- */
  function computeTotals() {
    var byPerson = {};
    PEOPLE.forEach(function (p) {
      byPerson[p] = { name: p, bets: [], banked: 0, live: 0, won: 0, lost: 0,
                      covering: 0, pending: 0, push: 0, openTotal: 0 };
    });
    (data.bets || []).forEach(function (b) {
      var g = games[b.gameId];
      var res = evaluate(b, g);
      var row = { bet: b, game: g, res: res };
      var p = byPerson[b.person];
      if (!p) { byPerson[b.person] = p = { name: b.person, bets: [], banked: 0,
        live: 0, won: 0, lost: 0, covering: 0, pending: 0, push: 0, openTotal: 0 }; }
      p.bets.push(row);
      var stillOpen = res.state === "pending" || res.state === "cover" ||
        res.state === "notcover";
      if (stillOpen) p.openTotal += payout(b);
      if (res.state === "won") { p.banked += payout(b); p.won++; }
      else if (res.state === "cover") { p.live += payout(b); p.covering++; }
      else if (res.state === "push") { p.banked += COUNT_STAKE ? STAKE : 0; p.push++; }
      else if (res.state === "lost") p.lost++;
      else if (res.state === "pending") p.pending++;
    });
    var list = Object.keys(byPerson).map(function (k) { return byPerson[k]; });
    list.forEach(function (p) {
      p.total = p.banked + p.live;
      p.projected = p.banked + p.openTotal;   // ceiling if every open bet hits
      p.bets.sort(function (x, y) {
        return kickoff(x.bet.gameId) - kickoff(y.bet.gameId);
      });
    });
    list.sort(function (a, b) {
      if (b.total !== a.total) return b.total - a.total;
      var aw = a.won + a.covering, bw = b.won + b.covering;
      if (bw !== aw) return bw - aw;                       // tiebreak: most winners
      var am = Math.max.apply(null, a.bets.map(function (r) {
        return r.res.state === "won" || r.res.state === "cover" ? payout(r.bet) : 0;
      }).concat([0]));
      var bm = Math.max.apply(null, b.bets.map(function (r) {
        return r.res.state === "won" || r.res.state === "cover" ? payout(r.bet) : 0;
      }).concat([0]));
      if (bm !== am) return bm - am;                       // then biggest single hit
      return a.name.localeCompare(b.name);
    });
    var rank = 0, lastKey = null;
    list.forEach(function (p, i) {
      var key = p.total + "|" + (p.won + p.covering);
      if (key !== lastKey) { rank = i + 1; lastKey = key; }
      p.rank = rank;
    });
    return list;
  }

  function renderBoard(list, sortMode) {
    var anyBets = (data.bets || []).length > 0;
    if (!anyBets) {
      document.getElementById("board").innerHTML =
        '<div class="card"><div class="empty">No bets submitted yet.<br>' +
        'Add them in the admin page.</div></div>';
      return;
    }
    var shown = list;
    var byMax = sortMode === "max";
    if (byMax) {
      shown = list.slice().sort(function (a, b) { return b.projected - a.projected; });
    }
    var rows = shown.map(function (p) {
      var parts = [];
      if (p.won) parts.push(p.won + " won");
      if (p.covering) parts.push(p.covering + " covering");
      if (p.push) parts.push(p.push + " push");
      if (p.lost) parts.push(p.lost + " lost");
      if (p.pending) parts.push(p.pending + " to play");
      var liveBit = p.live > 0
        ? '<i>' + money(p.banked) + ' banked <span class="live-amt">+ ' +
          money(p.live) + ' live</span></i>'
        : '<i>' + (parts.join(" &middot; ") || "no bets in") + '</i>';
      var rankTag = byMax ? "" : '<div class="rk">' + p.rank + '</div>';
      var amtBlock = byMax
        ? '<div class="amt"><b>' + money(p.projected) +
          '</b><i>if all opens hit</i></div>'
        : '<div class="amt"><b>' + money(p.total) + '</b><i>' +
          (p.live > 0 ? "incl. live" : "final") + '</i></div>';
      return '<div class="lb' + (byMax ? "" : " p" + (p.rank <= 3 ? p.rank : 0)) + '">' +
        rankTag +
        '<div class="nm"><b>' + p.name + '</b>' +
        (p.live > 0 ? liveBit : '<i>' + (parts.join(" &middot; ") || "no bets in") + '</i>') +
        '</div>' + amtBlock + '</div>';
    }).join("");
    var note = byMax
      ? '<div class="note">Each person\'s ceiling for the day: money already ' +
        'banked, plus every bet that hasn\'t lost yet (pending, covering, or ' +
        'still chasing) counted as if it hits. The best possible outcome from ' +
        'here, not a prediction.</div>'
      : '<div class="note">Draft order runs top to bottom. Live figures count bets ' +
        'currently covering but not yet final. ' +
        (COUNT_STAKE ? 'Each win also returns the $' + STAKE + ' stake. ' : '') +
        'Ties break on most winning bets, then biggest single payout.</div>';
    document.getElementById("board").innerHTML =
      '<div class="card"><div class="hd"><h2>Standings</h2>' +
      '<p>' + (byMax ? "Ceiling if every open bet hits"
                     : (COUNT_STAKE ? 'Money in hand after all five bets'
                                    : 'Winnings only')) +
      '</p></div>' + rows + note + '</div>';
  }

  function betRow(r, showPerson) {
    var b = r.bet, g = r.game, res = r.res;
    var cls = res.state === "won" ? "won" : res.state === "lost" ? "lost"
      : res.state === "cover" ? "cover" : res.state === "push" ? "push"
      : res.state === "notcover" ? "notcover" : "pend";
    var score = g && g.state !== "pre"
      ? g.list.map(function (t) { return t.abbr + " " + t.score; }).join(" – ")
      : (g ? g.short : "");
    var dim = (res.state === "won" || res.state === "cover") ? "" : " dim";
    return '<div class="bet"><span class="pill ' + cls + '">' + res.label + '</span>' +
      '<div class="bi"><b>' + (showPerson ? b.person + " &middot; " : "") +
      b.teamAbbr + " " + sign(b.line) + '</b>' +
      '<i>' + score + (res.note ? " &middot; " + res.note : "") + '</i></div>' +
      '<div class="bw' + dim + '">' + money(Number(b.toWin)) + '</div></div>';
  }

  function renderBets(list) {
    var host = document.getElementById("bets");
    if (!(data.bets || []).length) {
      host.innerHTML = '<div class="card"><div class="empty">No bets yet.</div></div>';
      return;
    }
    if (groupBy === "person") {
      host.innerHTML = list.map(function (p) {
        if (!p.bets.length) return "";
        return '<div class="card"><div class="hd"><h2>' + p.name + '</h2>' +
          '<p>' + money(p.total) + ' &middot; ' + p.bets.length + ' bets</p></div>' +
          p.bets.map(function (r) { return betRow(r, false); }).join("") + '</div>';
      }).join("");
    } else {
      var byGame = {};
      (data.bets || []).forEach(function (b) {
        (byGame[b.gameId] = byGame[b.gameId] || []).push(b);
      });
      host.innerHTML = Object.keys(byGame).sort(byKickoff).map(function (gid) {
        var g = games[gid];
        var rows = byGame[gid].map(function (b) {
          return betRow({ bet: b, game: g, res: evaluate(b, g) }, true);
        }).join("");
        var sub, score = "";
        if (!g) {
          sub = "not on the scoreboard";
        } else if (g.state === "pre") {
          sub = g.startText;
        } else {
          sub = g.detail;
          score = g.list.map(function (t) { return t.abbr + " " + t.score; })
            .join(" &ndash; ");
        }
        var badge = g && g.state === "in" ? '<span class="badge live">LIVE</span>' : "";
        return '<div class="card"><div class="hd">' + badge + '<h2>' +
          (g ? g.short : "Game " + gid) +
          (score ? '<span class="gscore">' + score + '</span>' : '') +
          '</h2><p>' + sub + '</p></div>' + rows + '</div>';
      }).join("");
    }
  }

  function render() {
    var list = computeTotals();
    renderBoard(list, boardSort);
    renderBets(list);
    var live = Object.keys(games).some(function (k) {
      var g = games[k]; return g.state === "in";
    });
    document.getElementById("dot").className = "dot" + (live ? " live" : "");
    var t = lastOk ? lastOk.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "—";
    document.getElementById("status").textContent =
      (live ? "Live · " : "") + "updated " + t;
  }

  function refresh() {
    if (!data) return;
    loadGames(data.date).then(function (g) {
      games = g; lastOk = new Date(); render();
    }).catch(function (e) {
      document.getElementById("status").textContent = "Score fetch failed — retrying";
    });
  }

  /* ---------- boot ---------- */
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (x) {
        x.classList.toggle("on", x === t);
      });
      document.querySelectorAll(".pane").forEach(function (p) {
        p.classList.toggle("on", p.dataset.pane === t.dataset.tab);
      });
      window.scrollTo(0, 0);
    });
  });
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.by) {
        groupBy = b.dataset.by;
        var seg = b.closest(".seg");
        seg.querySelectorAll("button").forEach(function (x) {
          x.classList.toggle("on", x === b);
        });
        renderBets(computeTotals());
      } else if (b.dataset.bsort) {
        boardSort = b.dataset.bsort;
        var seg2 = b.closest(".seg");
        seg2.querySelectorAll("button").forEach(function (x) {
          x.classList.toggle("on", x === b);
        });
        renderBoard(computeTotals(), boardSort);
      }
    });
  });
  document.getElementById("rf").addEventListener("click", refresh);

  loadBets().then(function (d) {
    data = d;
    if (d.people && d.people.length) PEOPLE = d.people;
    if (d.scoring === "returned") COUNT_STAKE = true;
    if (d.stake) STAKE = Number(d.stake);
    refresh();
    timer = setInterval(refresh, POLL);
  }).catch(function (e) {
    document.getElementById("status").textContent = "Could not load bets.json";
    document.getElementById("board").innerHTML =
      '<div class="card"><div class="empty">bets.json not found.<br>' +
      'Create it with the admin page.</div></div>';
  });
})();
</script>
</body>
</html>
